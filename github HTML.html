<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My YouTube Analytics</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0f0f 0%, #1a0a2e 100%);
    color: #f1f1f1; min-height: 100vh; padding: 24px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 28px; display: flex; align-items: center; gap: 10px; }
  .card {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(10px);
  }
  button {
    background: linear-gradient(135deg, #ff0033, #cc0029); color: white; border: none;
    padding: 12px 22px; border-radius: 10px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,0,51,0.4); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  select, input[type=date] {
    background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 8px;
    padding: 8px 12px; font-size: 14px;
  }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 12px; }
  .stat { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 16px; text-align: center; }
  .stat-value { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #ff0033, #ff6b6b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat-label { font-size: 12px; color: #999; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  canvas { width: 100%; height: 220px; margin-top: 16px; }
  .error { color: #ff6b6b; font-size: 14px; margin-top: 10px; }
  .muted { color: #999; font-size: 13px; }
  .table-wrap { overflow-x: auto; margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  th { color: #999; font-weight: 600; }
  .badge { display:inline-block; background: rgba(255,0,51,0.15); color:#ff6b6b; padding:3px 10px; border-radius:999px; font-size:11px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 My YouTube Analytics</h1>

  <div class="card">
    <div class="controls">
      <input id="clientIdInput" type="text" placeholder="Paste your Google OAuth Client ID"
        style="flex:1; min-width:260px; background:#1a1a1a; color:#fff; border:1px solid #333; border-radius:8px; padding:10px 12px;">
      <button id="signInBtn">Sign in with Google</button>
      <span id="status" class="muted"></span>
    </div>
    <div class="muted" id="hint">Paste the OAuth Client ID from Google Cloud Console, then sign in. Nothing is stored — you re-auth each session.</div>
    <div id="err" class="error"></div>
  </div>

  <div class="card" id="dashboard" style="display:none;">
    <div class="controls">
      <label class="muted">Date range:</label>
      <select id="rangeSelect">
        <option value="7">Last 7 days</option>
        <option value="28" selected>Last 28 days</option>
        <option value="90">Last 90 days</option>
        <option value="365">Last 365 days</option>
      </select>
      <button id="refreshBtn">Refresh</button>
      <span id="channelName" class="badge"></span>
    </div>

    <div class="stat-grid" id="statGrid"></div>

    <canvas id="viewsChart"></canvas>

    <div class="table-wrap">
      <table id="topVideosTable">
        <thead><tr><th>Video</th><th>Views</th><th>Watch time (hrs)</th><th>Avg % viewed</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let accessToken = null;
let tokenClient = null;

const statusEl = document.getElementById('status');
const errEl = document.getElementById('err');
const signInBtn = document.getElementById('signInBtn');
const clientIdInput = document.getElementById('clientIdInput');
const dashboard = document.getElementById('dashboard');

function showError(msg) { errEl.textContent = msg; console.error(msg); }
function clearError() { errEl.textContent = ''; }

function initTokenClient(clientId) {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: [
      'https://www.googleapis.com/auth/yt-analytics.readonly',
      'https://www.googleapis.com/auth/youtube.readonly'
    ].join(' '),
    callback: (resp) => {
      if (resp.error) { showError('Auth error: ' + resp.error); return; }
      accessToken = resp.access_token;
      statusEl.textContent = 'Signed in ✓';
      dashboard.style.display = 'block';
      loadDashboard();
    }
  });
}

signInBtn.addEventListener('click', () => {
  clearError();
  const clientId = clientIdInput.value.trim();
  if (!clientId) { showError('Paste your OAuth Client ID first.'); return; }
  if (!window.google || !google.accounts) { showError('Google script not loaded yet — wait a second and retry.'); return; }
  if (!tokenClient) initTokenClient(clientId);
  tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
});

document.getElementById('refreshBtn').addEventListener('click', loadDashboard);
document.getElementById('rangeSelect').addEventListener('change', loadDashboard);

async function apiFetch(url) {
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
  if (!res.ok) {
    const body = await res.text();
    throw new Error('API error ' + res.status + ': ' + body.slice(0, 200));
  }
  return res.json();
}

function fmtDate(d) { return d.toISOString().slice(0, 10); }

async function loadDashboard() {
  clearError();
  try {
    // 1. Get channel info (mine=true = the authenticated user's channel)
    const channelData = await apiFetch(
      'https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics,contentDetails&mine=true'
    );
    const channel = channelData.items[0];
    document.getElementById('channelName').textContent = channel.snippet.title;

    const days = parseInt(document.getElementById('rangeSelect').value, 10);
    const endDate = new Date();
    const startDate = new Date();
    startDate.setDate(startDate.getDate() - days);

    // 2. Channel-level analytics: views, watch time, subscribers gained, revenue estimate
    const metrics = 'views,estimatedMinutesWatched,averageViewDuration,subscribersGained,likes,comments';
    const analytics = await apiFetch(
      `https://youtubeanalytics.googleapis.com/v2/reports?ids=channel==MINE&startDate=${fmtDate(startDate)}&endDate=${fmtDate(endDate)}&metrics=${metrics}&dimensions=day&sort=day`
    );

    renderStats(analytics, channel);
    renderChart(analytics);

    // 3. Top videos by views in range
    const topVideos = await apiFetch(
      `https://youtubeanalytics.googleapis.com/v2/reports?ids=channel==MINE&startDate=${fmtDate(startDate)}&endDate=${fmtDate(endDate)}&metrics=views,estimatedMinutesWatched,averageViewPercentage&dimensions=video&sort=-views&maxResults=10`
    );
    await renderTopVideos(topVideos);

  } catch (e) {
    showError(e.message.includes('403')
      ? 'Permission error — make sure YouTube Analytics API is enabled and you approved both scopes.'
      : e.message);
  }
}

function sumColumn(rows, colIndex) {
  return rows.reduce((sum, r) => sum + (r[colIndex] || 0), 0);
}

function renderStats(analytics, channel) {
  const rows = analytics.rows || [];
  const headers = analytics.columnHeaders.map(h => h.name);
  const idx = (name) => headers.indexOf(name);

  const totalViews = sumColumn(rows, idx('views'));
  const totalMinutes = sumColumn(rows, idx('estimatedMinutesWatched'));
  const subsGained = sumColumn(rows, idx('subscribersGained'));
  const totalLikes = sumColumn(rows, idx('likes'));
  const totalComments = sumColumn(rows, idx('comments'));

  const stats = [
    { label: 'Views', value: totalViews.toLocaleString() },
    { label: 'Watch time (hrs)', value: Math.round(totalMinutes / 60).toLocaleString() },
    { label: 'Subscribers gained', value: subsGained.toLocaleString() },
    { label: 'Likes', value: totalLikes.toLocaleString() },
    { label: 'Comments', value: totalComments.toLocaleString() },
    { label: 'Total subscribers', value: parseInt(channel.statistics.subscriberCount || 0).toLocaleString() },
  ];

  document.getElementById('statGrid').innerHTML = stats.map(s =>
    `<div class="stat"><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div>`
  ).join('');
}

function renderChart(analytics) {
  const canvas = document.getElementById('viewsChart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 220 * dpr;
  ctx.scale(dpr, dpr);

  const rows = analytics.rows || [];
  const headers = analytics.columnHeaders.map(h => h.name);
  const viewsIdx = headers.indexOf('views');
  const values = rows.map(r => r[viewsIdx] || 0);
  const max = Math.max(...values, 1);

  const w = rect.width, h = 220, pad = 20;
  ctx.clearRect(0, 0, w, h);

  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath();
  ctx.moveTo(pad, h - pad); ctx.lineTo(w - pad, h - pad);
  ctx.stroke();

  if (values.length < 2) return;

  const stepX = (w - pad * 2) / (values.length - 1);
  ctx.beginPath();
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(255,0,51,0.35)');
  grad.addColorStop(1, 'rgba(255,0,51,0)');

  values.forEach((v, i) => {
    const x = pad + i * stepX;
    const y = h - pad - (v / max) * (h - pad * 2);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#ff3355';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.lineTo(pad + (values.length - 1) * stepX, h - pad);
  ctx.lineTo(pad, h - pad);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
}

async function renderTopVideos(topVideos) {
  const rows = topVideos.rows || [];
  const headers = topVideos.columnHeaders.map(h => h.name);
  const vIdx = headers.indexOf('video');
  const viewsIdx = headers.indexOf('views');
  const minutesIdx = headers.indexOf('estimatedMinutesWatched');
  const pctIdx = headers.indexOf('averageViewPercentage');

  const videoIds = rows.map(r => r[vIdx]).filter(Boolean);
  let titles = {};
  if (videoIds.length) {
    const details = await apiFetch(
      `https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${videoIds.join(',')}`
    );
    details.items.forEach(v => titles[v.id] = v.snippet.title);
  }

  const tbody = document.querySelector('#topVideosTable tbody');
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${titles[r[vIdx]] || r[vIdx]}</td>
      <td>${(r[viewsIdx] || 0).toLocaleString()}</td>
      <td>${Math.round((r[minutesIdx] || 0) / 60)}</td>
      <td>${(r[pctIdx] || 0).toFixed(1)}%</td>
    </tr>
  `).join('');
}
</script>
</body>
</html>
</parameter>
